<style>

*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text)}button,input{font:inherit}#map{position:absolute;inset:0;background:#dce5ed}.leaflet-container{font-family:inherit;background:#e7edf2}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom a{background:#13243a!important;color:#fff!important;border-color:#344a65!important}.leaflet-control-zoom{border:1px solid #344a65!important;box-shadow:var(--shadow)!important}.top{position:absolute;z-index:800;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;max-width:700px;margin:auto;pointer-events:none}.top>*{pointer-events:auto}.brandrow{display:flex;align-items:center;justify-content:space-between;margin:0 3px 9px;text-shadow:0 2px 9px #06101d}.brand{font-weight:850;letter-spacing:.1px;font-size:20px}.brand b{color:var(--gold)}.tagline{font-size:10px;color:#e3eaf4;letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}.live{border:1px solid #ffffff50;background:#12243bdf;border-radius:99px;padding:7px 10px;font-size:10px;color:#d9e5f4;box-shadow:var(--shadow)}.searchbox{background:#f9fbfd;border:1px solid #dbe4ee;border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;padding:5px 6px 5px 13px;gap:8px}.searchicon{font-size:22px;color:#40546b}.searchbox input{border:0;outline:0;min-width:0;flex:1;background:transparent;color:#12243a;font-size:15px;padding:10px 0}.searchbox input::placeholder{color:#718096}.searchbox button{width:43px;height:43px;border:0;border-radius:13px;background:var(--gold);color:#15243a;font-size:21px;font-weight:800}.chips{display:flex;gap:7px;overflow:auto;padding:9px 1px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #ffffff45;background:#13243bdd;color:#f4f7fb;border-radius:99px;padding:8px 11px;font-size:12px;box-shadow:0 3px 10px #06101d22}.chip:active,.chip.active{background:var(--gold);color:#13243a;border-color:var(--gold)}.floating{position:absolute;z-index:700;right:12px;top:48%;display:flex;flex-direction:column;gap:8px;transform:translateY(-50%)}.mapbtn{width:43px;height:43px;border:1px solid #ffffff55;border-radius:14px;background:#14263deb;color:white;font-size:18px;box-shadow:var(--shadow)}.mapbtn small{display:block;font-size:8px}.timeline{position:absolute;z-index:800;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:700px;margin:auto;background:linear-gradient(145deg,#14263bf5,#0d1a2cf7);border:1px solid #ffffff27;border-radius:23px;padding:14px 15px 13px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.timehead{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--gold);font-weight:850;text-transform:uppercase}.year{font-size:25px;font-weight:850;letter-spacing:-.6px}.year small{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:0}.timecontrols{display:flex;align-items:center;gap:8px}.play{border:0;background:var(--gold);color:#15243a;width:38px;height:38px;border-radius:13px;font-weight:900;font-size:16px}.reset{border:1px solid #ffffff35;background:#20334d;color:#eaf1f8;width:36px;height:36px;border-radius:12px;font-size:15px}.range{width:100%;margin:13px 0 0;accent-color:var(--gold);height:25px;cursor:pointer}.rangeends{display:flex;justify-content:space-between;color:#aab9cd;font-size:10px;margin-top:-2px}.timefoot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #ffffff19;margin-top:10px;padding-top:9px;font-size:11px;color:var(--muted)}.timefoot strong{color:#fff}.resultcount{color:var(--cyan);font-weight:750}.drawer{position:absolute;z-index:1100;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 118px);max-width:700px;margin:auto;max-height:43%;overflow:auto;display:none;background:#12233af7;border:1px solid #ffffff2b;border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.result{padding:12px 14px;border-bottom:1px solid #ffffff16;display:flex;gap:10px;align-items:flex-start}.result:last-child{border:0}.result:active{background:#253b56}.result .dot{width:9px;height:9px;background:var(--gold);border-radius:50%;margin-top:5px;flex-shrink:0}.result strong{display:block;font-size:13px}.result small{display:block;color:var(--gold);font-size:11px;margin-top:3px}.result p{margin:5px 0 0;font-size:11px;color:#c0ccdc;line-height:1.35}.close{position:sticky;top:0;float:right;margin:8px 8px 0;border:0;background:#263b54;color:white;border-radius:10px;padding:5px 9px}.popup{min-width:190px;max-width:260px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#14263b;color:#f4f7fb}.leaflet-popup-content{margin:13px;line-height:1.4}.pop-title{font-size:15px;font-weight:850;margin-bottom:5px}.pop-date{color:var(--gold);font-size:11px;font-weight:750;margin-bottom:6px}.pop-desc{font-size:12px;color:#c9d5e3}.pop-meta{font-size:10px;color:#91a7bf;margin-top:8px}.pop-link{display:inline-block;color:var(--cyan);font-weight:750;font-size:12px;text-decoration:none;margin-top:9px}.leaflet-popup-close-button{color:#fff!important}.pin{width:44px;height:48px;position:relative;filter:drop-shadow(0 3px 5px #07101d80)}.pin-photo{position:absolute;left:3px;top:2px;width:38px;height:38px;border:3px solid #fff;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);overflow:hidden;background:var(--gold)}.pin-photo img{width:100%;height:100%;object-fit:cover;transform:rotate(45deg) scale(1.42);display:block}.pin-fallback{position:absolute;left:14px;top:13px;width:16px;height:16px;border:3px solid #fff;border-radius:50%;background:var(--gold)}.pin.person .pin-photo,.pin.person .pin-fallback{background:#80d8dc}.pin.event .pin-photo,.pin.event .pin-fallback{background:#f2c968}.pin.place .pin-photo,.pin.place .pin-fallback{background:#a9c8ff}.result{cursor:pointer}.result img{width:58px;height:58px;object-fit:cover;border-radius:10px;flex-shrink:0;border:1px solid #ffffff30}.result .dot{display:none}.statusmsg{position:absolute;z-index:650;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:#14263bf2;border:1px solid #ffffff30;border-radius:15px;padding:16px;max-width:300px;width:calc(100% - 40px);text-align:center;box-shadow:var(--shadow)}.statusmsg strong{display:block;margin-bottom:5px}.statusmsg span{color:#b6c6d9;font-size:12px}.leaflet-attribution-flag{display:none!important}@media(min-width:700px){.top{left:24px;right:auto;width:420px}.timeline{left:24px;right:auto;width:420px;bottom:20px}.drawer{left:24px;right:auto;width:420px;top:145px}.floating{right:24px}}@media(max-height:650px){.chips{padding-top:5px}.timeline{padding:10px 13px}.range{margin-top:7px}.timefoot{margin-top:6px;padding-top:6px}.drawer{max-height:35%;top:108px}}
</style>

<body>
<div id="map" aria-label="Mapa histórico interativo"></div>
<header class="top">
 <div class="brandrow"><div><div class="brand">crono<b>maps</b></div><div class="tagline">A história acontece em todo lugar</div></div><div class="live" id="status">● mapa online</div></div>
 <form class="searchbox" id="searchForm"><span class="searchicon">⌕</span><input id="query" type="search" placeholder="Busque pessoa, batalha, império, lugar…" autocomplete="off" enterkeyhint="search"><button id="searchBtn" aria-label="Pesquisar">↗</button></form>
 <div class="chips"><button class="chip" data-q="Cleópatra">Cleópatra</button><button class="chip" data-q="Segunda Guerra Mundial">Guerras</button><button class="chip" data-q="Império Romano">Impérios</button><button class="chip" data-q="Dinossauros">Pré-história</button><button class="chip" data-q="Revolução Francesa">Revoluções</button></div>
</header>
<div class="floating"><button class="mapbtn" id="homeBtn" aria-label="Ver mundo">⌖<small>MUNDO</small></button><button class="mapbtn" id="zoomIn" aria-label="Aproximar">＋</button><button class="mapbtn" id="zoomOut" aria-label="Afastar">−</button></div>
<div class="drawer" id="results"></div>
<div class="statusmsg" id="notice"><strong>Conectando ao mapa…</strong><span>Confira sua internet se o mapa não aparecer.</span></div>
<section class="timeline" aria-label="Linha do tempo histórica">
 <div class="timehead"><div><div class="eyebrow">Viaje no tempo</div><div class="year" id="yearLabel">Todos os tempos</div></div><div class="timecontrols"><button class="reset" id="allTime" title="Mostrar todas as épocas">∞</button><button class="play" id="playBtn" title="Reproduzir linha do tempo">▶</button></div></div>
 <input class="range" id="yearRange" type="range" min="-3000" max="2026" step="10" value="2026" aria-label="Escolher ano histórico">
 <div class="rangeends"><span>3000 a.C.</span><span>2026 d.C.</span></div>
 <div class="timefoot"><span id="eraLabel">Todas as épocas no mapa</span><span class="resultcount" id="countLabel">12 locais</span></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),status=$('status'),range=$('yearRange'),yearLabel=$('yearLabel'),eraLabel=$('eraLabel'),countLabel=$('countLabel'),results=$('results');
if(!window.L){$('notice').style.display='block';$('notice').querySelector('strong').textContent='O mapa não carregou';$('notice').querySelector('span').textContent='Confira sua conexão e reabra o aplicativo.';status.textContent='mapa offline';return;}
const map=L.map('map',{zoomControl:false,preferCanvas:true,worldCopyJump:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,keyboard:true}).setView([25,10],2);
const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:1,maxZoom:19,updateWhenIdle:true,keepBuffer:2,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
tiles.on('tileerror',()=>{status.textContent='erro ao carregar mapa';});tiles.on('load',()=>{status.textContent='● mapa online';});
L.control.zoom({position:'bottomright'}).addTo(map);
const layer=L.layerGroup().addTo(map);let searchItems=[],allItems=[],playing=false,playTimer=null,allMode=true,requestId=0;
// yearStart/yearEnd are approximate and explicitly presented as approximate when sourced from broad eras.
const seeds=[
{title:'Pirâmides de Gizé',year:-2560,yearEnd:-2500,lat:29.9792,lon:31.1342,type:'place',desc:'Complexo funerário construído durante a IV dinastia do Egito Antigo.',url:'https://pt.wikipedia.org/wiki/Pir%C3%A2mides_de_Giz%C3%A9'},
{title:'Nascimento de Cleópatra VII',year:-69,lat:31.2001,lon:29.9187,type:'person',desc:'Cleópatra nasceu em Alexandria e tornou-se a última governante ativa do Reino Ptolemaico.',url:'https://pt.wikipedia.org/wiki/Cle%C3%B3patra_VII'},
{title:'Acrópole de Atenas',year:-447,yearEnd:-432,lat:37.9715,lon:23.7267,type:'place',desc:'A construção do Partenon começou durante a Atenas clássica.',url:'https://pt.wikipedia.org/wiki/Acr%C3%B3pole_de_Atenas'},
{title:'Assassinato de Júlio César',year:-44,lat:41.8955,lon:12.4768,type:'event',desc:'César foi assassinado em Roma nos Idos de Março.',url:'https://pt.wikipedia.org/wiki/J%C3%BAlio_C%C3%A9sar'},
{title:'Erupção do Vesúvio e Pompeia',year:79,lat:40.7509,lon:14.4869,type:'event',desc:'A erupção do Vesúvio soterrou Pompeia e outras localidades romanas.',url:'https://pt.wikipedia.org/wiki/Pompeia'},
{title:'Construção de Angkor Wat',year:1150,yearEnd:1200,lat:13.4125,lon:103.867,type:'place',desc:'Templo monumental associado ao Império Khmer, no atual Camboja.',url:'https://pt.wikipedia.org/wiki/Angkor_Wat'},
{title:'Fundação de Tenochtitlán',year:1325,lat:19.4326,lon:-99.1332,type:'event',desc:'A cidade mexica tornou-se a capital do Império Asteca.',url:'https://pt.wikipedia.org/wiki/Tenochtitlan'},
{title:'Chegada de Colombo ao Caribe',year:1492,lat:24.052,lon:-74.531,type:'event',desc:'A expedição de Cristóvão Colombo chegou às Américas em 1492; o ponto exato do primeiro desembarque é debatido.',url:'https://pt.wikipedia.org/wiki/Crist%C3%B3v%C3%A3o_Colombo'},
{title:'Início da Revolução Francesa',year:1789,lat:48.8566,lon:2.3522,type:'event',desc:'A Revolução Francesa começou em meio a uma crise política, social e financeira.',url:'https://pt.wikipedia.org/wiki/Revolu%C3%A7%C3%A3o_Francesa'},
{title:'Independência do Brasil',year:1822,lat:-23.5505,lon:-46.6333,type:'event',desc:'A independência foi proclamada por Pedro de Alcântara em 7 de setembro de 1822, às margens do Ipiranga, na atual cidade de São Paulo.',url:'https://pt.wikipedia.org/wiki/Independ%C3%AAncia_do_Brasil'},
{title:'Primeiro voo dos irmãos Wright',year:1903,lat:36.014,lon:-75.667,type:'event',desc:'Os irmãos Wright realizaram voos motorizados em Kitty Hawk, Carolina do Norte.',url:'https://pt.wikipedia.org/wiki/Irm%C3%A3os_Wright'},
{title:'Início da Primeira Guerra Mundial',year:1914,lat:43.8563,lon:18.4131,type:'event',desc:'O assassinato do arquiduque Francisco Ferdinando em Sarajevo foi o estopim da crise que levou à guerra.',url:'https://pt.wikipedia.org/wiki/Primeira_Guerra_Mundial'},
{title:'Desembarque na Normandia',year:1944,lat:49.342,lon:-0.55,type:'event',desc:'A operação aliada de 6 de junho abriu uma grande frente na Europa Ocidental durante a Segunda Guerra Mundial.',url:'https://pt.wikipedia.org/wiki/Desembarques_da_Normandia'},
{title:'Primeiro pouso humano na Lua',year:1969,lat:0.674,lon:23.473,type:'event',desc:'A missão Apollo 11 pousou no Mar da Tranquilidade, na Lua. O ponto é extraterrestre e aparece apenas como referência aproximada no mapa terrestre.',url:'https://pt.wikipedia.org/wiki/Apollo_11'}
];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function yearText(y){if(y==null||!Number.isFinite(Number(y)))return 'Data não informada';y=Number(y);return y<0?`${Math.abs(y)} a.C.`:`${y} d.C.`;}
function icon(o){const type=o.type||'event';const photo=o.thumbnail?`<div class="pin-photo"><img src="${esc(o.thumbnail)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.style.display='none'"></div>`:`<div class="pin-fallback"></div>`;return L.divIcon({className:'',html:`<div class="pin ${type}">${photo}</div>`,iconSize:[44,48],iconAnchor:[22,43],popupAnchor:[0,-40]});}
function popup(o){const when=o.year!=null?yearText(o.year)+(o.yearEnd&&o.yearEnd!==o.year?' – '+yearText(o.yearEnd):''):'Data não identificada';return `<div class="popup">${o.thumbnail?`<img src="${esc(o.thumbnail)}" alt="" style="width:100%;max-height:130px;object-fit:cover;border-radius:9px;margin-bottom:8px" referrerpolicy="no-referrer">`:''}<div class="pop-title">${esc(o.title)}</div><div class="pop-date">${esc(when)} · ${o.type==='person'?'PERSONAGEM':o.type==='place'?'LOCAL':'ACONTECIMENTO'}</div><div class="pop-desc">${esc((o.desc||'Consulte a fonte para mais informações.').slice(0,650))}</div><div class="pop-meta">Fonte: ${esc(o.source||'Wikipédia / Wikidata')} · datas podem ser aproximadas</div>${o.url?`<a class="pop-link" href="${esc(o.url)}" target="_blank" rel="noopener">Ler fonte completa ↗</a>`:''}</div>`;}
function marker(o){if(!Number.isFinite(Number(o.lat))||!Number.isFinite(Number(o.lon)))return null;return L.marker([+o.lat,+o.lon],{icon:icon(o),title:o.title,keyboard:true}).bindPopup(popup(o),{maxWidth:280});}
async function loadThumbnail(o){try{let title=o.title;const match=(o.url||'').match(/\/wiki\/(.+)$/);if(match){try{title=decodeURIComponent(match[1]).replace(/_/g,' ');}catch(_){}}const api='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=180&titles='+encodeURIComponent(title);const r=await fetch(api);if(!r.ok)return;const d=await r.json();const page=Object.values(d.query?.pages||{})[0];if(page?.thumbnail?.source){o.thumbnail=page.thumbnail.source;if(o._marker)o._marker.setIcon(icon(o));}}catch(_){}}
function addSeedMarkers(){seeds.forEach(o=>{const m=marker(o);if(m){o._marker=m;allItems.push(o);loadThumbnail(o);}});refreshTime();}
function refreshTime(){const y=Number(range.value);yearLabel.textContent=allMode?'Todos os tempos':yearText(y);eraLabel.textContent=allMode?'Explore os acontecimentos de diferentes épocas':`Acontecimentos próximos de ${yearText(y)}`;layer.clearLayers();let visible=0;allItems.forEach(o=>{const inTime=allMode||o.year==null||((o.year<=y)&&(o.yearEnd==null||o.yearEnd>=y))||Math.abs(o.year-y)<=40;if(inTime){const m=o._marker||marker(o);if(m){m.addTo(layer);visible++;}}});countLabel.textContent=`${visible} ${visible===1?'marcador':'marcadores'}`;}
function closeResults(){results.style.display='none';results.innerHTML='';}
function showResults(items){results.innerHTML='<button class="close" id="closeResults">Fechar ×</button>';if(!items.length){results.innerHTML+='<div class="result"><div><strong>Nenhum resultado localizado no mapa</strong><p>Tente outro nome. Algumas pessoas não têm coordenadas associadas à própria página; o Cronomaps tenta usar o local de nascimento quando disponível.</p></div></div>';results.style.display='block';$('closeResults').onclick=closeResults;return;}items.slice(0,16).forEach(o=>{const el=document.createElement('div');el.className='result';el.innerHTML=`${o.thumbnail?`<img src="${esc(o.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'<div class="dot"></div>'}<div><strong>${esc(o.title)}</strong><small>${esc(o.year!=null?yearText(o.year):'Data não encontrada')} · ${esc(o.source||'Wikipédia')}</small><p>${esc((o.desc||'Resultado com coordenadas geográficas.').slice(0,160))}</p></div>`;el.onclick=()=>{allMode=true;range.value=2026;refreshTime();if(o._marker){map.flyTo([o.lat,o.lon],Math.max(5,map.getZoom()),{duration:.35});o._marker.openPopup();}else{const m=marker(o);if(m){o._marker=m;allItems.push(o);refreshTime();map.flyTo([o.lat,o.lon],Math.max(5,map.getZoom()),{duration:.35});m.openPopup();}}closeResults();};results.appendChild(el);});results.style.display='block';$('closeResults').onclick=closeResults;}
// Wikipedia search finds articles; Wikidata enriches them with coordinates and time claims.
async function wikiSearch(q){const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=0&gsrlimit=12&prop=coordinates%7Cextracts%7Cinfo%7Cpageprops%7Cpageimages&piprop=thumbnail&pithumbsize=180&inprop=url&exintro=1&explaintext=1&exchars=450';const r=await fetch(url);if(!r.ok)throw Error('Wikipedia '+r.status);const d=await r.json();return Object.values(d.query?.pages||{}).map(p=>({title:p.title,lat:p.coordinates?.[0]?.lat,lon:p.coordinates?.[0]?.lon,desc:p.extract||'',thumbnail:p.thumbnail?.source||'',url:p.fullurl||('https://pt.wikipedia.org/wiki/'+encodeURIComponent(p.title.replace(/ /g,'_'))),source:'Wikipédia',type:'event'}));}
async function wikidataSearch(q){const url='https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(q)+'&language=pt&uselang=pt&format=json&origin=*&limit=10';const r=await fetch(url);if(!r.ok)throw Error('Wikidata '+r.status);const d=await r.json();const entities=(d.search||[]).slice(0,8);const out=[];for(const e of entities){try{const rr=await fetch('https://www.wikidata.org/wiki/Special:EntityData/'+encodeURIComponent(e.id)+'.json');if(!rr.ok)continue;const dd=await rr.json(),entity=dd.entities?.[e.id],c=entity?.claims||{},getTime=prop=>{const v=c[prop]?.[0]?.mainsnak?.datavalue?.value?.time;if(!v)return null;const m=v.match(/[+-](\d{1,6})-/);if(!m)return null;let yr=Number(m[1]);if(v.startsWith('-'))yr=-yr;return yr;},getCoord=prop=>{const v=c[prop]?.[0]?.mainsnak?.datavalue?.value;return v&&Number.isFinite(v.latitude)&&Number.isFinite(v.longitude)?{lat:v.latitude,lon:v.longitude}:null};let coord=getCoord('P625'),year=getTime('P571')??getTime('P585')??getTime('P569'),imageFile=c.P18?.[0]?.mainsnak?.datavalue?.value;let thumbnail=imageFile?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(imageFile)+'?width=180':'';let type='event';if(c.P569){type='person';year=getTime('P569')??year;}if(!coord&&c.P19?.[0]?.mainsnak?.datavalue?.value?.id){const placeId=c.P19[0].mainsnak.datavalue.value.id;try{const pr=await fetch('https://www.wikidata.org/wiki/Special:EntityData/'+placeId+'.json');const pd=await pr.json();const pc=pd.entities?.[placeId]?.claims?.P625?.[0]?.mainsnak?.datavalue?.value;if(pc&&Number.isFinite(pc.latitude)&&Number.isFinite(pc.longitude))coord={lat:pc.latitude,lon:pc.longitude};}catch(_){}}if(!coord&&c.P276?.[0]?.mainsnak?.datavalue?.value?.id){const placeId=c.P276[0].mainsnak.datavalue.value.id;try{const pr=await fetch('https://www.wikidata.org/wiki/Special:EntityData/'+placeId+'.json');const pd=await pr.json();const pc=pd.entities?.[placeId]?.claims?.P625?.[0]?.mainsnak?.datavalue?.value;if(pc&&Number.isFinite(pc.latitude)&&Number.isFinite(pc.longitude))coord={lat:pc.latitude,lon:pc.longitude};}catch(_){}}if(!coord)continue;out.push({title:e.label||entity.labels?.pt?.value||e.id,lat:coord.lat,lon:coord.lon,year,desc:e.description||entity.descriptions?.pt?.value||'',thumbnail,url:'https://www.wikidata.org/wiki/'+e.id,source:'Wikidata',type,entityId:e.id});}catch(_){}}return out;}
async function search(q){q=q.trim();if(!q)return;const id=++requestId;closeResults();status.textContent='pesquisando…';$('searchBtn').textContent='…';$('searchBtn').disabled=true;try{const [w,wd]=await Promise.allSettled([wikiSearch(q),wikidataSearch(q)]);if(id!==requestId)return;let merged=[];if(w.status==='fulfilled')merged=merged.concat(w.value);if(wd.status==='fulfilled')merged=merged.concat(wd.value);const seen=new Set();merged=merged.filter(o=>{if(!Number.isFinite(Number(o.lat))||!Number.isFinite(Number(o.lon)))return false;const k=(o.title||'').toLocaleLowerCase('pt-BR')+'|'+Number(o.lat).toFixed(2)+'|'+Number(o.lon).toFixed(2);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,16);allItems=allItems.filter(o=>!o._fromSearch);searchItems=[];merged.forEach(o=>{o._fromSearch=true;o._marker=marker(o);if(o._marker){searchItems.push(o);allItems.push(o);if(!o.thumbnail)loadThumbnail(o);}});allMode=true;refreshTime();status.textContent=searchItems.length?`${searchItems.length} resultados`:'sem coordenadas';if(searchItems.length){const b=L.latLngBounds(searchItems.map(o=>[o.lat,o.lon]));if(b.isValid()){if(searchItems.length===1)map.flyTo([searchItems[0].lat,searchItems[0].lon],Math.max(5,map.getZoom()),{duration:.4});else map.flyToBounds(b.pad(.25),{maxZoom:6,duration:.4});}}showResults(searchItems);if(!searchItems.length&&w.status==='rejected'&&wd.status==='rejected')status.textContent='sem conexão';}catch(e){status.textContent='erro na busca';showResults([]);}finally{$('searchBtn').textContent='↗';$('searchBtn').disabled=false;}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('query').value);});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{$('query').value=b.dataset.q;search(b.dataset.q);}));range.addEventListener('input',()=>{allMode=false;refreshTime();});$('allTime').addEventListener('click',()=>{allMode=true;range.value=2026;refreshTime();});$('playBtn').addEventListener('click',()=>{playing=!playing;$('playBtn').textContent=playing?'Ⅱ':'▶';if(playing){allMode=false;let y=Number(range.value);playTimer=setInterval(()=>{y+=20;if(y>2026)y=-3000;range.value=y;refreshTime();},700);}else clearInterval(playTimer);});$('homeBtn').addEventListener('click',()=>{map.flyTo([25,10],2,{duration:.35});});$('zoomIn').addEventListener('click',()=>map.zoomIn());$('zoomOut').addEventListener('click',()=>map.zoomOut());map.on('click',closeResults);window.addEventListener('resize',()=>map.invalidateSize());window.addEventListener('load',()=>{setTimeout(()=>map.invalidateSize(true),250);setTimeout(()=>map.invalidateSize(true),900);});
addSeedMarkers();status.textContent='● mapa pronto';
})();

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1728">
<title>Cronomaps — mapa histórico</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#0b1728;--panel:#12243a;--gold:#efc75e;--text:#f3f6fb;--muted:#a7b7ca;--line:#2a4059}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text)}body{display:flex;flex-direction:column}.topbar{z-index:1000;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;border-bottom:1px solid var(--line);box-shadow:0 3px 16px #0005}.brand{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:19px;font-weight:750;letter-spacing:.2px}.brand-icon{width:31px;height:31px;display:grid;place-items:center;background:var(--gold);color:#172238;border-radius:10px;font-size:18px}.brand span{color:var(--gold)}.search{display:flex;gap:8px}.search input{width:100%;min-width:0;border:1px solid #344d68;background:#f8fafc;color:#152238;border-radius:13px;padding:13px 14px;font-size:16px;outline:none}.search input::placeholder{color:#69788b}.search input:focus{border-color:var(--gold);box-shadow:0 0 0 2px #efc75e30}.search button{flex:0 0 50px;border:0;border-radius:13px;background:var(--gold);color:#142238;font-size:22px;font-weight:700}.subline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;font-size:11px;color:var(--muted)}#status{white-space:nowrap}#map{flex:1;min-height:0;width:100%;background:#d8e0e7}.leaflet-container{font-family:system-ui,-apple-system,Roboto,Arial,sans-serif}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10233a;color:#f4f7fb}.leaflet-popup-content{margin:12px 14px;line-height:1.4;min-width:180px;max-width:260px}.popup-title{font-weight:750;font-size:15px;margin-bottom:5px}.popup-date{font-size:11px;color:#efc75e;margin-bottom:6px}.popup-desc{font-size:12px;color:#d0dbea}.popup-link{display:inline-block;margin-top:8px;color:#75d9ec;text-decoration:none;font-weight:650;font-size:12px}.leaflet-popup-close-button{color:#fff!important}.pin{width:30px;height:38px;position:relative}.pin:before{content:'';position:absolute;left:5px;top:1px;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#efc75e;border:2px solid #fff;box-shadow:0 2px 5px #0006}.pin:after{content:'';position:absolute;left:12px;top:8px;width:8px;height:8px;border-radius:50%;background:#162943}.legend{position:absolute;z-index:500;bottom:18px;left:12px;background:#10233aeb;border:1px solid #52677d;border-radius:12px;padding:9px 11px;color:#f1f5f9;font-size:11px;box-shadow:0 3px 12px #0003;max-width:calc(100% - 24px)}.legend strong{color:var(--gold)}.leaflet-control-zoom a{background:#10233a!important;color:#fff!important;border-color:#3b526c!important}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-attribution a{color:#20588b!important}.busy{opacity:.65}.error{color:#ffd0c7!important}.results{position:absolute;z-index:1200;top:110px;left:12px;right:12px;max-height:42%;overflow:auto;background:#10233af5;border:1px solid #344d68;border-radius:14px;box-shadow:0 8px 30px #0006;display:none}.result{padding:11px 13px;border-bottom:1px solid #2a4059;cursor:pointer}.result:last-child{border-bottom:0}.result:active{background:#203c59}.result strong{display:block;font-size:13px}.result small{display:block;color:#efc75e;margin-top:2px}.result p{font-size:11px;color:#c1cede;margin:5px 0 0}.notice{position:absolute;z-index:600;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 36px);max-width:360px;background:#10233af2;border:1px solid #52677d;border-radius:15px;padding:18px;text-align:center;box-shadow:0 8px 28px #0004;display:none}.notice strong{display:block;margin-bottom:5px}.notice p{margin:0;color:#c1cede;font-size:12px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-icon">⌖</div><div>Crono<span>maps</span></div></div>
  <form class="search" id="searchForm"><input id="query" type="search" placeholder="Buscar lugar, pessoa ou evento histórico…" autocomplete="off" enterkeyhint="search"><button id="searchBtn" aria-label="Pesquisar">⌕</button></form>
  <div class="subline"><span>Pesquise e toque nos marcadores para ver as fontes</span><span id="status">Conectando…</span></div>
</header>
<div id="map" aria-label="Mapa histórico interativo"></div>
<div id="results" class="results"></div>
<div id="notice" class="notice"><strong>Não foi possível carregar o mapa</strong><p>Confira sua conexão com a internet e tente novamente.</p></div>
<div class="legend"><strong>Mapa histórico</strong><br>Arraste para mover · use +/− para zoom<br>Os dados dos resultados vêm da Wikipédia.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function(){
 const $=id=>document.getElementById(id), status=$('status'), notice=$('notice'), results=$('results');
 if(!window.L){status.textContent='Mapa indisponível';status.className='error';notice.style.display='block';return;}
 const map=L.map('map',{zoomControl:true,preferCanvas:true,worldCopyJump:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView([22,8],2);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:1,maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',updateWhenIdle:true,keepBuffer:2}).addTo(map);
 const markers=L.layerGroup().addTo(map);let searchMarkers=[];const cache={};
 const historic=[
  {title:'Pirâmides de Gizé',date:'c. 2600 a.C.',lat:29.9792,lon:31.1342,desc:'Complexo de pirâmides construído no Antigo Egito.',wiki:'https://pt.wikipedia.org/wiki/Pir%C3%A2mides_de_Giz%C3%A9'},
  {title:'Acrópole de Atenas',date:'Antiguidade grega',lat:37.9715,lon:23.7267,desc:'Cidadela histórica associada à Atenas antiga.',wiki:'https://pt.wikipedia.org/wiki/Acr%C3%B3pole_de_Atenas'},
  {title:'Coliseu de Roma',date:'Inaugurado em 80 d.C.',lat:41.8902,lon:12.4922,desc:'Anfiteatro da Roma imperial.',wiki:'https://pt.wikipedia.org/wiki/Coliseu'},
  {title:'Petra',date:'Antiguidade',lat:30.3285,lon:35.4444,desc:'Cidade histórica nabateia escavada na rocha.',wiki:'https://pt.wikipedia.org/wiki/Petra'},
  {title:'Stonehenge',date:'c. 3000–2000 a.C.',lat:51.1789,lon:-1.8262,desc:'Monumento pré-histórico de círculos de pedras.',wiki:'https://pt.wikipedia.org/wiki/Stonehenge'},
  {title:'Machu Picchu',date:'Século XV',lat:-13.1631,lon:-72.545,desc:'Cidade inca situada nos Andes peruanos.',wiki:'https://pt.wikipedia.org/wiki/Machu_Picchu'},
  {title:'Angkor Wat',date:'Século XII',lat:13.4125,lon:103.867,desc:'Templo monumental do Império Khmer.',wiki:'https://pt.wikipedia.org/wiki/Angkor_Wat'},
  {title:'Pompeia',date:'Destruída em 79 d.C.',lat:40.7509,lon:14.4869,desc:'Cidade romana soterrada pela erupção do Vesúvio.',wiki:'https://pt.wikipedia.org/wiki/Pompeia'},
  {title:'Grande Muralha da China',date:'Vários períodos',lat:40.4319,lon:116.5704,desc:'Sistema de fortificações construído ao longo de séculos.',wiki:'https://pt.wikipedia.org/wiki/Grande_Muralha_da_China'},
  {title:'Tenochtitlán (centro histórico)',date:'Fundada no século XIV',lat:19.4326,lon:-99.1332,desc:'Capital do Império Asteca, na atual Cidade do México.',wiki:'https://pt.wikipedia.org/wiki/Tenochtitlan'},
  {title:'Teotihuacán',date:'c. 100 a.C.–550 d.C.',lat:19.6925,lon:-98.8438,desc:'Grande centro urbano da Mesoamérica antiga.',wiki:'https://pt.wikipedia.org/wiki/Teotihuacan'},
  {title:'Éfeso',date:'Antiguidade',lat:37.9394,lon:27.3417,desc:'Cidade antiga da Anatólia, hoje na Turquia.',wiki:'https://pt.wikipedia.org/wiki/%C3%89feso'}
 ];
 function icon(){return L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[30,38],iconAnchor:[15,36],popupAnchor:[0,-32]});}
 function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function popupHtml(o){return '<div class="popup-title">'+esc(o.title)+'</div>'+(o.date?'<div class="popup-date">'+esc(o.date)+'</div>':'')+(o.desc?'<div class="popup-desc">'+esc(o.desc.slice(0,480))+'</div>':'')+(o.wiki?'<a class="popup-link" href="'+esc(o.wiki)+'" target="_blank" rel="noopener">Abrir fonte / Wikipédia ↗</a>':'');}
 function addMarker(o,layer=markers){if(!Number.isFinite(Number(o.lat))||!Number.isFinite(Number(o.lon)))return null;const m=L.marker([Number(o.lat),Number(o.lon)],{icon:icon(),keyboard:true,title:o.title||'Evento histórico'}).bindPopup(popupHtml(o),{maxWidth:280});m.addTo(layer);m.on('click',()=>{status.textContent='Fonte histórica';});return m;}
 historic.forEach(o=>addMarker(o));status.textContent='Mapa pronto';
 function closeResults(){results.style.display='none';results.innerHTML='';}
 function showResults(items){results.innerHTML='';if(!items.length){results.innerHTML='<div class="result"><strong>Nenhum resultado com coordenadas</strong><p>Tente outro termo, por exemplo: Cleópatra, Roma, Pompeia ou Vikings.</p></div>';results.style.display='block';return;}items.forEach((o,i)=>{const div=document.createElement('div');div.className='result';div.innerHTML='<strong>'+esc(o.title)+'</strong>'+(o.date?'<small>'+esc(o.date)+'</small>':'')+'<p>'+esc((o.desc||'Artigo da Wikipédia').slice(0,150))+'</p>';div.addEventListener('click',()=>{if(o.marker){map.flyTo([o.lat,o.lon],Math.max(map.getZoom(),5),{duration:.35});o.marker.openPopup();}closeResults();});results.appendChild(div);});results.style.display='block';}
 async function search(q){q=q.trim();if(!q)return;closeResults();status.textContent='Buscando…';status.classList.remove('error');$('searchBtn').classList.add('busy');
  searchMarkers.forEach(m=>map.removeLayer(m));searchMarkers=[];
  try{
   const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=0&gsrlimit=18&prop=coordinates%7Cextracts%7Cinfo&inprop=url&exintro=1&explaintext=1&exchars=500&colimit=10';
   const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const pages=Object.values((data.query&&data.query.pages)||{});
   const items=pages.map(p=>{const c=p.coordinates&&p.coordinates[0];if(!c)return null;return {title:p.title,lat:c.lat,lon:c.lon,desc:p.extract||'',wiki:p.fullurl||('https://pt.wikipedia.org/wiki/'+encodeURIComponent(p.title.replace(/ /g,'_'))),date:'Fonte: Wikipédia',pageid:p.pageid};}).filter(Boolean);
   if(!items.length){status.textContent='Sem coordenadas';showResults([]);return;}
   items.forEach(o=>{o.marker=addMarker(o);if(o.marker)searchMarkers.push(o.marker);});
   const bounds=L.latLngBounds(items.map(o=>[o.lat,o.lon]));if(bounds.isValid()){if(items.length===1)map.flyTo([items[0].lat,items[0].lon],Math.max(map.getZoom(),6),{duration:.4});else map.flyToBounds(bounds.pad(.25),{maxZoom:7,duration:.4});}
   status.textContent=items.length+' local(is)';showResults(items);
  }catch(e){status.textContent='Sem conexão';status.classList.add('error');showResults([]);const first=results.firstElementChild;if(first)first.innerHTML='<strong>Não foi possível consultar a Wikipédia</strong><p>Confira a internet e tente novamente. Os marcadores históricos iniciais continuam disponíveis no mapa.</p>';}
  finally{$('searchBtn').classList.remove('busy');}
 }
 $('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('query').value);});
 map.on('click',()=>{if(results.style.display==='block')closeResults();});
 window.addEventListener('load',()=>{setTimeout(()=>map.invalidateSize(true),250);setTimeout(()=>map.invalidateSize(true),900);});window.addEventListener('resize',()=>map.invalidateSize(true));
 setTimeout(()=>{if(!document.querySelector('.leaflet-tile')){notice.style.display='block';status.textContent='Verifique a conexão';}},6500);
})();
</script>
</body>
</html>
